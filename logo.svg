<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Receipt logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8f63"/>
      <stop offset="0.5" stop-color="#14663f"/>
      <stop offset="1" stop-color="#0a3d26"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3f0"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd6b0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3fa878" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#04210f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- icon background -->
  <path fill="url(#bg)"
    d="M172,32 L340,32 C412,32 480,100 480,172 L480,340 C480,412 412,480 340,480 L172,480 C100,480 32,412 32,340 L32,172 C32,100 100,32 172,32 Z"/>

  <!-- receipt -->
  <path filter="url(#shadow)" fill="url(#paper)"
    d="M146,116 Q146,110 152,110 L161.7,124 L177.4,110 L193.1,124 L208.9,110 L224.6,124 L240.3,110 L256,124 L271.7,110 L287.4,124 L303.1,110 L318.9,124 L334.6,110 L350.3,124 L360,110 Q366,110 366,116
       L366,376 C366,392 356,400 340,400 L184,400 C160,400 146,388 146,364 Z"/>

  <!-- dollar sign -->
  <g fill="none" stroke="#1f3b2f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M279,175 C277,162 268,157 256,157 C242,157 233,164 233,174 C233,184 241,188 256,192 C271,196 279,200 279,210 C279,220 270,227 256,227 C243,227 234,221 232,209"/>
    <path d="M256,143 V154 M256,230 V241"/>
  </g>

  <!-- line items -->
  <g>
    <circle cx="172" cy="270" r="10" fill="#ff8a00"/>
    <circle cx="172" cy="304" r="10" fill="#d61fff"/>
    <circle cx="172" cy="338" r="10" fill="#00c48c"/>
    <rect x="194" y="264" width="70" height="12" rx="4" fill="#b3b7c4"/>
    <rect x="194" y="298" width="46" height="12" rx="4" fill="#b3b7c4"/>
    <rect x="194" y="332" width="54" height="12" rx="4" fill="#b3b7c4"/>
    <rect x="316" y="264" width="30" height="12" rx="4" fill="#8b90a3"/>
    <rect x="300" y="298" width="46" height="12" rx="4" fill="#8b90a3"/>
  </g>
</svg>
